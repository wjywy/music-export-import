name: Deploy to Aliyun

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_PORT || '22' }}
          script: |
            set -e
            cd "${{ secrets.ALIYUN_DEPLOY_PATH }}"
            git fetch origin "${{ github.event.inputs.ref || 'main' }}"
            git checkout "${{ github.event.inputs.ref || 'main' }}"
            git pull --ff-only origin "${{ github.event.inputs.ref || 'main' }}"
            sudo docker compose -p dukou -f docker-compose.prod.yml --env-file .env.production up -d --build
            sudo docker compose -p dukou -f docker-compose.prod.yml --env-file .env.production ps
