          渡口是一个在浏览器里使用的歌单迁移工具：粘贴 QQ 音乐、网易云音乐或 Apple Music
          的公开歌单链接，自动匹配曲目，再写进你在目标平台的新歌单。

          <li>Apple Music 公开歌单迁移到 QQ 音乐 / 网易云音乐</li>
        </ul>
        <h2>怎么用</h2>
        <ol>
          <li>注册并登录渡口。</li>
          <li>粘贴一张公开歌单链接，选择目标平台。</li>
          <li>扫码或授权一次，确认匹配结果后写入新歌单。</li>
        </ol>
