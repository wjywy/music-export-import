services:
  mysql:
    image: mysql:8.4
    container_name: dukou-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dukou
      MYSQL_USER: dukou
      MYSQL_PASSWORD: dukou
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - dukou-mysql:/var/lib/mysql
volumes:
  dukou-mysql:
