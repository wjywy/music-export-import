services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: dukou-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dukou
      MYSQL_USER: dukou
      MYSQL_PASSWORD: dukou
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-udukou", "-pdukou"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - dukou-mysql:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

volumes:
  dukou-mysql:
