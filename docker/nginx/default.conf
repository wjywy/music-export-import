server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Compression for text assets (the SPA shell, CSS, JS, sitemap).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/json
        application/javascript
        application/manifest+json
        image/svg+xml;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        # Let another Nginx proxy also disable buffering for progress events.
        proxy_pass_header X-Accel-Buffering;
    }

    # SEO files are served from the SPA root and revalidated hourly.
    location = /robots.txt {
        default_type text/plain;
        expires 1h;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        expires 1h;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1d;
        try_files $uri =404;
    }

    # These public SEO assets are not content-hashed, so keep a short TTL:
    # replacing the share image or icons must be visible without a new URL.
    location = /og-image.png {
        expires 1d;
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 1d;
        try_files $uri =404;
    }

    location = /apple-touch-icon.png {
        expires 1d;
        try_files $uri =404;
    }

    location = /icon-192.png {
        expires 1d;
        try_files $uri =404;
    }

    location = /icon-512.png {
        expires 1d;
        try_files $uri =404;
    }

    # Vite emits content-hashed assets; the regex block can cache them forever.
    location ~* \.(js|css|woff2|png|jpg|jpeg|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /tool/ {
        try_files /tool/index.html =404;
    }

    location /tool/ {
        try_files $uri $uri/index.html /tool/index.html;
    }

    # The SPA shell must be revalidated so new deployments are picked up.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
